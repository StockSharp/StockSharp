name: .NET Tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout StockSharp
        uses: actions/checkout@v4
        with:
          path: 'StockSharp (GitHub)'

      - name: Checkout Connectors
        uses: actions/checkout@v4
        with:
          repository: StockSharp/Connectors
          path: Connectors

      - name: Checkout documentation
        uses: actions/checkout@v4
        with:
          repository: StockSharp/doc
          path: doc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test validation scripts
        working-directory: 'StockSharp (GitHub)'
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Validate solution connector coverage
        working-directory: 'StockSharp (GitHub)'
        run: python scripts/check-solution-connectors.py

      - name: Validate connector READMEs
        working-directory: 'StockSharp (GitHub)'
        run: python scripts/check-readme-connectors.py

      - name: Validate connector coverage
        working-directory: 'StockSharp (GitHub)'
        run: python scripts/check-connector-coverage.py

      - name: Validate README documentation links
        working-directory: 'StockSharp (GitHub)'
        run: python scripts/check-readme-doc-links.py

      - name: Validate localization string counts
        working-directory: 'StockSharp (GitHub)'
        shell: powershell
        run: ./scripts/validate-localization-strings.ps1

      - name: Validate localization string ordering
        working-directory: 'StockSharp (GitHub)'
        shell: powershell
        run: ./scripts/sort-localization-strings.ps1 -Check

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # StockSharp_CI.slnx references the sample connector projects at ../Connectors/, and
      # the connectors in turn reference back at ../StockSharp (GitHub)/ — so both repos
      # must sit side by side and this repo's folder must be named "StockSharp (GitHub)".
      # Reproduce that layout by checking each repo into its own sibling folder.
      - name: Checkout StockSharp
        uses: actions/checkout@v4
        with:
          path: 'StockSharp (GitHub)'

      - name: Checkout Connectors
        uses: actions/checkout@v4
        with:
          repository: StockSharp/Connectors
          path: Connectors
          # If StockSharp/Connectors is private, the default token can't read it —
          # supply a PAT/secret with access:
          # token: ${{ secrets.CONNECTORS_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Build StockSharp_CI.slnx (Windows only)
        if: matrix.os == 'windows-latest'
        working-directory: 'StockSharp (GitHub)'
        run: dotnet build StockSharp_CI.slnx --configuration Release

      - name: Build StockSharp_Tests.slnx (non-Windows)
        if: matrix.os != 'windows-latest'
        working-directory: 'StockSharp (GitHub)'
        run: dotnet build StockSharp_Tests.slnx --configuration Release

      - name: Run tests
        working-directory: 'StockSharp (GitHub)'
        env:
          SQLSERVER_CONNECTION_STRING: ${{ secrets.SQLSERVER_CONNECTION_STRING }}
        # Seven minutes exceeds the longest per-test timeout (six minutes) while
        # still leaving time to upload a dump before the 30-minute job timeout.
        run: >
          dotnet test StockSharp_Tests.slnx
          --no-build
          --configuration Release
          --results-directory TestResults
          --logger "trx;LogFileName=tests.trx"
          --diag vstest-diagnostics.log
          --blame-hang
          --blame-hang-timeout 7m
          --blame-hang-dump-type mini

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: |
            StockSharp (GitHub)/TestResults
            StockSharp (GitHub)/vstest-diagnostics*
          if-no-files-found: warn
          retention-days: 7
